<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Adventkalender Fachhandel</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Anton&family=DM+Serif+Display:ital@0;1&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: Adventskalender als Türchen-Raster (Händleransicht) + Verwaltung als Arbeitsfläche mit Sortiment, Tagesbelegung, Einstellungen */
:root{
  --bg:#EEF1F8; --surface:#FFFFFF; --surface-2:#F6F8FC; --ink:#0B1638; --muted:#5A6688; --line:#D9DFEC;
  --door:#11286F; --door-2:#1B3A94; --door-ink:#F4E3B5; --gold:#D6A13C; --accent:#C8102E; --accent-ink:#FFFFFF;
  --ok:#1C7C4A; --warn:#B4610B; --past:#9AA3BA;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Figtree", -apple-system, "Segoe UI", system-ui, sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#070D22; --surface:#0F1A3A; --surface-2:#13214A; --ink:#E7ECF8; --muted:#9AA6C6; --line:#24335E;
  --door:#16307F; --door-2:#2246A8; --door-ink:#F6E6BC; --gold:#E2B256; --accent:#E5334F; --accent-ink:#FFFFFF;
  --ok:#3FB97A; --warn:#E39A3B; --past:#5E6A8C; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#070D22; --surface:#0F1A3A; --surface-2:#13214A; --ink:#E7ECF8; --muted:#9AA6C6; --line:#24335E;
  --door:#16307F; --door-2:#2246A8; --door-ink:#F6E6BC; --gold:#E2B256; --accent:#E5334F; --accent-ink:#FFFFFF;
  --ok:#3FB97A; --warn:#E39A3B; --past:#5E6A8C; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--door)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* Kopfband */
.band{background:var(--door);color:var(--door-ink);position:relative;overflow:hidden}
.band::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.18;
  background-image:radial-gradient(circle at 20% 30%,#fff 1px,transparent 1.6px),radial-gradient(circle at 70% 60%,#fff 1px,transparent 1.6px),radial-gradient(circle at 45% 85%,#fff .8px,transparent 1.4px);
  background-size:90px 90px,130px 130px,70px 70px}
.band .wrap{padding-block:18px 22px;position:relative;z-index:1}
.topline{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.brandrow{display:flex;align-items:center;flex-wrap:wrap;gap:10px 0;min-width:0}
.brandrow img{display:block;height:20px;width:auto;max-width:100%}
.brandrow img + img{margin-left:14px;padding-left:14px;border-left:1px solid rgba(255,255,255,.35);box-sizing:content-box}
.brandrow .lg-eb{height:15px}
.brandrow .lg-beko{height:21px}
.brandrow .lg-ind{height:17px}
@media (max-width:420px){.brandrow .lg-eb{height:12px}.brandrow .lg-beko{height:17px}.brandrow .lg-ind{height:14px}.brandrow img + img{margin-left:10px;padding-left:10px}}
.brands{font-size:12px;letter-spacing:.14em;text-transform:uppercase;opacity:.85}
.tabs{display:flex;gap:4px;background:rgba(255,255,255,.1);border-radius:999px;padding:3px}
.tabs button{border:0;background:transparent;color:var(--door-ink);padding:6px 14px;border-radius:999px;font-weight:600;font-size:13px}
.tabs button[aria-pressed="true"]{background:var(--door-ink);color:var(--door)}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(30px,6vw,52px);line-height:1;margin:18px 0 6px;letter-spacing:-.02em;text-wrap:balance}
.sub{margin:0;opacity:.85;max-width:60ch}
.notice{margin-top:12px;display:inline-flex;gap:8px;align-items:center;background:rgba(255,255,255,.12);border-radius:8px;padding:6px 10px;font-size:13px}

/* Tagesaktion */
main{padding-block:22px 60px}
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:26px}
.hero .pic{background:var(--surface-2);display:grid;place-items:center;padding:24px;min-height:240px;position:relative}
.hero .pic img{max-height:260px;object-fit:contain}
.hero .info{padding:24px 26px;display:flex;flex-direction:column;gap:10px;min-width:0}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.hero h2{font-family:var(--f-display);font-size:clamp(24px,3.4vw,34px);line-height:1.05;margin:0;font-weight:700}
.hero .type{color:var(--muted);margin:0}
.prices{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 18px;margin-top:4px}
.prices .deal{font-family:var(--f-display);font-weight:800;font-size:40px;color:var(--accent);line-height:1}
.prices .was{color:var(--muted);text-decoration:line-through}
.prices .save{background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:13px;border-radius:6px;padding:2px 8px}
.plabel{font-size:12px;color:var(--muted);display:block}
.stock{display:inline-flex;align-items:center;gap:8px;font-weight:700;color:var(--warn)}
.stock::before{content:"";width:9px;height:9px;border-radius:50%;background:currentColor;box-shadow:0 0 0 4px color-mix(in srgb,currentColor 20%,transparent)}
.stock.out{color:var(--past)}
.clock{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.clock b{font-family:var(--f-display);font-size:22px;color:var(--ink)}
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:6px}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:600;text-decoration:none;color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.dark{background:var(--door);border-color:var(--door);color:var(--door-ink)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.small{font-size:13px;color:var(--muted)}
.empty-hero{padding:34px 26px;text-align:left;grid-column:1/-1}
.empty-hero h2{margin-bottom:6px}
.badge-brand{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--door-2)}

/* Kalender */
.cal-head{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.cal-head h3{font-family:var(--f-display);font-size:24px;margin:0}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:5px}
.grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.grid.month{grid-template-columns:repeat(7,minmax(0,1fr))}
.grid.cols-1{grid-template-columns:minmax(0,1fr);max-width:300px}
.grid.cols-2{grid-template-columns:repeat(2,minmax(0,1fr));max-width:560px}
.grid.cols-3{grid-template-columns:repeat(3,minmax(0,1fr));max-width:820px}
.grid.cols-4{grid-template-columns:repeat(4,minmax(0,1fr))}
.grid.cols-5{grid-template-columns:repeat(5,minmax(0,1fr))}
.wd{font-size:12px;font-weight:700;color:var(--muted);text-align:center;letter-spacing:.06em}
.door{position:relative;aspect-ratio:1/1.12;border-radius:12px;border:0;padding:0;background:transparent;perspective:900px;text-align:left;max-width:100%}
.door .face{position:absolute;inset:0;border-radius:12px;overflow:hidden}
.door .inside{background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;padding:8px}
.door .inside img{flex:1;min-height:0;object-fit:contain;width:100%}
.door .inside .m{font-size:11px;font-weight:700;line-height:1.15;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.door .inside .p{font-family:var(--f-display);font-weight:800;color:var(--accent);font-size:15px;line-height:1.1}
.door .inside .q{font-size:10.5px;color:var(--warn);font-weight:700}
.door .inside .dno{position:absolute;top:6px;left:8px;font-family:var(--f-display);font-weight:800;font-size:14px;color:var(--muted)}
.door .flap{background:linear-gradient(155deg,var(--door-2),var(--door));color:var(--door-ink);display:flex;flex-direction:column;justify-content:space-between;padding:10px 11px;
  transform-origin:left center;transition:transform .9s cubic-bezier(.3,.7,.2,1),opacity .9s;backface-visibility:hidden;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.door .flap::after{content:"";position:absolute;inset:6px;border:1px dashed color-mix(in srgb,var(--door-ink) 35%,transparent);border-radius:8px;pointer-events:none}
.door .flap .n{font-family:var(--f-display);font-weight:800;font-size:clamp(26px,4.4vw,44px);line-height:.9}
.door .flap .d{font-size:11px;opacity:.8;letter-spacing:.04em}
.door .flap .knob{position:absolute;right:12px;top:50%;width:7px;height:7px;border-radius:50%;background:var(--gold)}
.door.open .flap{transform:rotateY(-105deg);opacity:0;pointer-events:none}
.door.today{box-shadow:0 0 0 3px var(--gold);border-radius:12px}
.door.today:not(.open) .flap{background:linear-gradient(155deg,var(--accent),color-mix(in srgb,var(--accent) 60%,var(--door)))}
.door.today:not(.open) .flap .d::after{content:" · Heute öffnen";font-weight:700}
.door .ribbon{position:absolute;top:6px;right:6px;z-index:2;background:var(--accent);color:var(--accent-ink);font-size:10px;font-weight:800;letter-spacing:.08em;padding:2px 6px;border-radius:4px}
.door.past .inside img{filter:grayscale(1);opacity:.45}
.door.past .inside .m,.door.past .inside .p{color:var(--past)}
.door.past .inside .p{text-decoration:line-through}
.door .stamp{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%) rotate(-14deg);border:2px solid var(--past);color:var(--past);font-weight:800;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;
  padding:3px 6px;border-radius:5px;background:color-mix(in srgb,var(--surface) 80%,transparent);white-space:nowrap;text-align:center;line-height:1.15}
.door.noact .inside{justify-content:center;align-items:center;color:var(--muted);font-size:12px;text-align:center}
.door.blank{visibility:hidden}
.door.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
@media (prefers-reduced-motion: reduce){.door .flap{transition:none}.door.shake{animation:none}}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;z-index:50;max-width:calc(100% - 32px)}

/* Detail-Dialog */
.overlay{position:fixed;inset:0;background:rgba(5,10,30,.55);display:grid;place-items:center;z-index:40;padding:16px}
.dialog{background:var(--surface);border-radius:var(--r);max-width:720px;width:100%;max-height:calc(100% - 20px);overflow:auto;position:relative}
.dialog .hero{margin:0;border:0}
.dialog .x{position:absolute;top:10px;right:10px;z-index:3;border:0;background:var(--surface-2);border-radius:50%;width:34px;height:34px;font-size:18px}
.expired-banner{background:var(--past);color:#fff;font-weight:700;text-align:center;padding:6px;font-size:13px;letter-spacing:.05em;text-transform:uppercase}

/* Verwaltung */
.admin h2{font-family:var(--f-display);font-size:26px;margin:0 0 4px}
.section{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:18px}
.section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.section-head h3{margin:0;font-family:var(--f-display);font-size:20px}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--muted);min-width:0}
input[type=text],input[type=number],input[type=email],input[type=date],input[type=tel],input[type=password],select{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:8px 10px;width:100%;min-width:0;font-size:14px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--surface-2);padding:8px 14px;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--door);color:var(--door-ink)}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;align-items:center}
.chip{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600}
.chip[aria-pressed="true"]{background:var(--door);border-color:var(--door);color:var(--door-ink)}
.filters input[type=text]{max-width:240px}
.filters select{max-width:200px}
.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.pcard{display:grid;grid-template-columns:64px minmax(0,1fr);gap:10px;border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--surface)}
.pcard.on{border-color:var(--ok);box-shadow:inset 0 0 0 1px var(--ok)}
.pcard img,.pcard .noimg{width:64px;height:64px;object-fit:contain;background:var(--surface-2);border-radius:8px}
.pcard .meta{min-width:0}
.pcard .m{font-weight:700;font-size:14px;line-height:1.2;overflow-wrap:anywhere}
.pcard .t{font-size:12px;color:var(--muted);line-height:1.3;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.pcard .row{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pcard .row .toggle{grid-column:1/-1}
.assign{grid-column:1/-1;border-top:1px dashed var(--line);padding-top:8px;display:flex;flex-direction:column;gap:6px}
.assign-l{font-size:11.5px;font-weight:700;color:var(--muted);letter-spacing:.02em}
.assign-chips{display:flex;flex-wrap:wrap;gap:6px}
.dchip{border:1px solid var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--surface));color:var(--ink);border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:700}
.dchip b{color:var(--accent);margin-left:2px}
.toggle{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:7px 10px;font-weight:700;font-size:13px;white-space:nowrap}
.pcard.on .toggle{background:var(--ok);border-color:var(--ok);color:#fff}
.days{display:flex;flex-direction:column;gap:6px}
.drow{display:grid;grid-template-columns:92px minmax(0,2.4fr) repeat(3,minmax(0,1fr)) 36px;gap:8px;align-items:end;padding:8px;border-radius:10px;background:var(--surface-2)}
.drow.today{box-shadow:inset 0 0 0 2px var(--gold)}
.drow.past{opacity:.7}
.drow .dt{font-weight:700;font-size:14px;align-self:center}
.drow .dt small{display:block;font-weight:500;color:var(--muted);font-size:11.5px}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;height:38px;width:36px;font-size:16px;color:var(--muted)}
.savebar{position:sticky;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);margin-top:10px;padding-bottom:env(safe-area-inset-bottom,0px)}
.savebar .wrap{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-block:10px;flex-wrap:wrap}
.dirty{color:var(--warn);font-weight:700}
.warnline{color:var(--warn);font-size:12px;font-weight:600}


/* ---------- Black Deals (Black Friday / Week / Month) ---------- */
.marquee{display:none}
body.black{ --bg:#0B0B0D; --surface:#151518; --surface-2:#1D1D22; --line:#2D2D35; --ink:#F5F5F6; --muted:#A3A3AE; --door:#000000; --door-2:#1B1B20; --door-ink:#FFFFFF;
  --accent:#FF2E4D; --accent-ink:#FFFFFF; --gold:#FFD400; --warn:#FFD400; --past:#5C5C68; --ok:#3CCB7F; color-scheme:dark;
  --f-cond:"Anton", Impact, "Arial Narrow Bold", sans-serif }
body.black::before{background:#000}
body.black .band{background:#000;color:#fff;border-bottom:1px solid var(--line)}
body.black .band::after{display:none}
body.black .band .wrap{padding-block:18px 64px}
body.black h1{font-family:var(--f-cond);font-weight:400;text-transform:uppercase;font-size:clamp(48px,11vw,112px);line-height:.9;letter-spacing:.01em;color:#fff}
body.black h1::first-letter{color:var(--gold)}
body.black .brands{color:var(--gold);opacity:1}
body.black .sub{opacity:.75}
body.black .tabs{background:#1D1D22}
body.black .tabs button{color:#fff}
body.black .tabs button[aria-pressed="true"]{background:var(--gold);color:#000}
body.black .notice{background:#1D1D22}
body.black .marquee{display:block;position:absolute;left:0;right:0;bottom:0;background:var(--gold);color:#000;overflow:hidden;white-space:nowrap;height:36px;line-height:36px}
.mq-track{display:inline-block;padding-left:0;animation:mq 38s linear infinite}
.mq-track span{font-family:var(--f-cond);font-size:18px;letter-spacing:.06em;text-transform:uppercase;padding:0 14px}
.mq-track b{font-size:12px}
@keyframes mq{to{transform:translateX(-50%)}}
body.black .hero{background:var(--surface);border-color:var(--line)}
body.black .hero .pic{background:radial-gradient(circle at 50% 45%,#2A2A31,#141417 70%)}
body.black .hero h2,body.black .cal-head h3,body.black .admin h2{font-family:var(--f-cond);font-weight:400;text-transform:uppercase;letter-spacing:.02em}
body.black .hero .eyebrow{color:var(--gold)}
body.black .badge-brand{color:#C9C9D2}
body.black .prices .deal{font-family:var(--f-cond);font-weight:400;color:var(--gold);font-size:54px}
body.black .prices .save{background:var(--accent);font-size:15px;padding:3px 9px;transform:rotate(-3deg)}
body.black .btn.primary{background:var(--gold);border-color:var(--gold);color:#000}
body.black .btn{background:#1D1D22}
body.black .btn.primary{background:var(--gold)}
body.black .door .flap{background:linear-gradient(160deg,#1E1E24,#000 70%);border:1px solid #2F2F37;color:#fff}
body.black .door .flap::after{display:none}
body.black .door .flap::before{content:"DEAL";position:absolute;right:-26px;top:12px;transform:rotate(45deg);background:var(--accent);color:#fff;font-weight:800;font-size:10px;letter-spacing:.12em;padding:2px 30px}
body.black .door .flap .n{font-family:var(--f-cond);font-weight:400;font-size:clamp(34px,5.6vw,60px)}
body.black .door .flap .knob{display:none}
body.black .door.today{box-shadow:0 0 0 3px var(--gold)}
body.black .door.today:not(.open) .flap{background:var(--gold);color:#000;border-color:var(--gold);animation:pulse 1.6s ease-in-out infinite}
body.black .door.today:not(.open) .flap .d::after{content:" · Jetzt öffnen"}
@keyframes pulse{50%{box-shadow:0 0 26px 4px color-mix(in srgb,var(--gold) 50%,transparent)}}
body.black .door .inside{background:#151518;border-color:#2D2D35}
body.black .door .inside .dno{font-family:var(--f-cond);font-weight:400;font-size:17px;color:var(--gold)}
body.black .door .inside .p{color:var(--gold);font-family:var(--f-cond);font-weight:400;font-size:17px}
body.black .door.past .inside .p,body.black .door.past .inside .dno{color:var(--past)}
body.black .door .stamp{background:rgba(0,0,0,.75);border-color:#77778A;color:#C7C7D1}
body.black .door .ribbon{background:var(--gold);color:#000}
body.black .grid.month .door .flap::before{display:none}
body.black .wd{color:var(--gold)}
body.black .legend .l-closed{background:#000!important;box-shadow:inset 0 0 0 1px #55555F}
body.black .toast{background:var(--gold);color:#000}
body.black .section,body.black .pcard{background:var(--surface)}
body.black .seg button[aria-pressed="true"],body.black .chip[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:#000}
body.black .pcard.on{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
body.black .pcard.on .toggle{background:var(--gold);border-color:var(--gold);color:#000}
body.black .dchip{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 14%,var(--surface))}
body.black .dchip b{color:var(--gold)}
body.black .section{border-color:color-mix(in srgb,var(--gold) 45%,var(--line))}
body.black .drow.today{box-shadow:inset 0 0 0 2px var(--gold)}
@media (prefers-reduced-motion: reduce){.mq-track,body.black .door.today:not(.open) .flap{animation:none}}
@media (max-width:820px){body.black .door .flap::before{font-size:8px;right:-30px;top:8px}}

/* ---------- Weihnachtsausstattung (Adventmodus) ---------- */
:root{ --pine:#123F2F; --pine-2:#1D5A43; --berry:#A3122A; --berry-2:#C3233B; --navy:#16285E; --xbg:#F5EFE3; --xsurface:#FFFDF8; --xsurface2:#F2EADA; --xline:#E3D6BD; --snow:#FFFFFF; --wire:rgba(247,230,188,.45); --xbrand:#1D5A43; --f-serif:"DM Serif Display", Georgia, "Times New Roman", serif }
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){ --pine:#0F3527; --pine-2:#18513C; --berry:#8C1024; --berry-2:#B4243B; --navy:#132457; --xbg:#08130F; --xsurface:#0F1F19; --xsurface2:#152A21; --xline:#26402F; --xbrand:#E2B256 }}
:root[data-theme="dark"]{ --pine:#0F3527; --pine-2:#18513C; --berry:#8C1024; --berry-2:#B4243B; --navy:#132457; --xbg:#08130F; --xsurface:#0F1F19; --xsurface2:#152A21; --xline:#26402F; --xbrand:#E2B256 }
body.xmas{ --bg:var(--xbg); --surface:var(--xsurface); --surface-2:var(--xsurface2); --line:var(--xline); --door:var(--pine); --door-2:var(--pine-2); --accent:var(--berry-2); --door-ink:#F7E6BC }
body.xmas::before{background:var(--pine)}
.snow,.lights{display:none}
body.xmas .band{background:radial-gradient(120% 140% at 85% -10%,var(--pine-2),var(--pine) 60%)}
body.xmas .band::after{display:none}
body.xmas .band .wrap{padding-block:18px 52px}
body.xmas .snow{display:block;position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
body.xmas .lights{display:flex;position:absolute;left:0;right:0;bottom:4px;height:30px;overflow:hidden;pointer-events:none;
  background:radial-gradient(ellipse 31px 15px at 30px 0,transparent 94%,var(--wire) 95%,var(--wire) 99%,transparent 100%) repeat-x;background-size:60px 30px}
.lights span{flex:0 0 60px;position:relative}
.lights span::before{content:"";position:absolute;left:30px;top:13px;width:9px;height:14px;margin-left:-4.5px;border-radius:50% 50% 50% 50%/40% 40% 60% 60%;
  background:var(--b);box-shadow:0 0 10px 2px var(--b);animation:twinkle 2.4s ease-in-out infinite;animation-delay:var(--dl)}
.lights span::after{content:"";position:absolute;left:30px;top:10px;width:5px;height:5px;margin-left:-2.5px;background:var(--wire);border-radius:1px}
@keyframes twinkle{0%,100%{opacity:1}50%{opacity:.45;box-shadow:0 0 3px 0 var(--b)}}
body.xmas h1{font-family:var(--f-serif);font-weight:400;font-size:clamp(40px,8vw,72px);letter-spacing:0}
body.xmas h1::after{content:" ✦";color:var(--gold);font-size:.45em;vertical-align:.9em}
body.xmas .brands{color:var(--gold);opacity:1}
body.xmas .tabs button[aria-pressed="true"]{background:var(--gold);color:var(--pine)}
body.xmas .hero{border-color:color-mix(in srgb,var(--gold) 55%,var(--line));box-shadow:0 0 0 4px color-mix(in srgb,var(--gold) 14%,transparent)}
body.xmas .hero h2,body.xmas .cal-head h3,body.xmas .admin h2{font-family:var(--f-serif);font-weight:400}
body.xmas .hero .eyebrow{color:var(--berry-2)}
body.xmas .badge-brand{color:var(--xbrand)}
body.xmas .prices .deal{font-family:var(--f-serif);font-weight:400;font-size:46px}
body.xmas .btn.primary{box-shadow:0 2px 0 color-mix(in srgb,var(--berry) 70%,#000)}
/* Türchen als Geschenke */
body.xmas .door{--dc:var(--pine)}
body.xmas .door.c1{--dc:var(--berry)}
body.xmas .door.c2{--dc:var(--navy)}
body.xmas .door .flap{background:
  linear-gradient(90deg,transparent 66%,var(--gold) 66%,var(--gold) 73%,transparent 73%),
  linear-gradient(180deg,transparent 62%,var(--gold) 62%,var(--gold) 69%,transparent 69%),
  radial-gradient(circle at 18% 12%,rgba(255,255,255,.16),transparent 55%),
  repeating-linear-gradient(45deg,rgba(255,255,255,.035) 0 6px,transparent 6px 12px),
  var(--dc)}
body.xmas .door .flap::after{display:none}
body.xmas .door .flap .n{font-family:var(--f-serif);font-weight:400;font-size:clamp(30px,5vw,52px)}
body.xmas .door .flap .knob{left:69.5%;top:65.5%;right:auto;width:14px;height:14px;transform:translate(-50%,-50%);
  background:radial-gradient(circle at 40% 35%,#F7DE97,var(--gold) 70%);
  box-shadow:-10px -7px 0 -1px var(--gold),10px -7px 0 -1px var(--gold),0 0 0 2px color-mix(in srgb,var(--gold) 60%,#000)}
body.xmas .door.today:not(.open) .flap{background:
  linear-gradient(90deg,transparent 66%,var(--gold) 66%,var(--gold) 73%,transparent 73%),
  linear-gradient(180deg,transparent 62%,var(--gold) 62%,var(--gold) 69%,transparent 69%),
  radial-gradient(circle at 18% 12%,rgba(255,255,255,.22),transparent 55%),var(--berry-2);animation:glow 2.2s ease-in-out infinite}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--gold) 0%,transparent)}50%{box-shadow:0 0 22px 2px color-mix(in srgb,var(--gold) 55%,transparent)}}
body.xmas .door .inside{background:radial-gradient(circle at 50% 0,color-mix(in srgb,var(--gold) 10%,var(--surface)),var(--surface) 70%)}
body.xmas .door .inside .dno{font-family:var(--f-serif);font-weight:400;font-size:17px;color:var(--berry-2)}
body.xmas .door.past .inside .dno{color:var(--past)}
body.xmas .door .ribbon{background:var(--gold);color:var(--pine)}
body.xmas .legend .l-closed{background:var(--pine)!important}
.xmas-foot{display:none}
body.xmas .xmas-foot{display:block;text-align:center;margin-top:34px;font-family:var(--f-serif);font-size:24px;color:var(--pine-2)}
body.xmas .xmas-foot small{display:block;font-family:var(--f-body);font-size:13px;color:var(--muted);margin-top:2px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) body.xmas .xmas-foot{color:var(--gold)}}
:root[data-theme="dark"] body.xmas .xmas-foot{color:var(--gold)}
@media (prefers-reduced-motion: reduce){.lights span::before,body.xmas .door.today:not(.open) .flap{animation:none}}
@media (max-width:820px){body.xmas .grid.month .door .flap .knob{display:none}}
@media (max-width:820px){
  .hero{grid-template-columns:1fr}
  .hero .pic{min-height:180px}
  .grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
  .grid.month{grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
  .grid.month .door .inside{padding:3px}
  .grid.month .door .inside .m,.grid.month .door .inside .q{display:none}
  .grid.month .door .inside .p{font-size:11px}
  .grid.month .door .flap{padding:5px}
  .grid.month .door .flap .n{font-size:18px}
  .grid.month .door .flap .d,.grid.month .door .knob{display:none}
  .grid.month .door .stamp{font-size:7.5px;padding:1px 3px;border-width:1px}
  .grid.month .door .ribbon{font-size:7px;padding:1px 3px}
  .drow{grid-template-columns:repeat(3,minmax(0,1fr)) 36px}
  .drow .dt{grid-column:1/-1}
  .drow .prod{grid-column:1/-1}
}
@media (max-width:820px){.grid.cols-5{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:420px){.grid.cols-6,.grid:not([class*='cols-']):not(.month){grid-template-columns:repeat(3,minmax(0,1fr))}.grid.cols-4{grid-template-columns:repeat(2,minmax(0,1fr))}}


/* Bestellung */
.orderbox{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin-top:6px}
.qtyf{flex:0 0 auto}
.stepper{display:inline-flex;align-items:stretch;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface-2)}
.stepper button{border:0;background:transparent;width:38px;font-size:18px;font-weight:700;color:var(--ink)}
.stepper button:disabled{opacity:.35}
.stepper input{width:58px;text-align:center;border:0;border-left:1px solid var(--line);border-right:1px solid var(--line);border-radius:0;background:var(--surface);font-weight:700;font-size:16px;padding:8px 4px;-moz-appearance:textfield}
.stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.stepper.sm button{width:30px;height:30px;font-size:16px}
.stepper.sm span{min-width:30px;display:grid;place-items:center;font-weight:700}
.cartfab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:30;border:0;border-radius:999px;padding:12px 18px;font-weight:800;font-size:15px;background:var(--accent);color:var(--accent-ink);box-shadow:0 8px 24px rgba(0,0,0,.25)}
.cartfab b{display:inline-grid;place-items:center;min-width:24px;height:24px;border-radius:999px;background:var(--accent-ink);color:var(--accent);margin-left:6px;font-size:13px;padding:0 6px}
body.black .cartfab{background:var(--gold);color:#000}body.black .cartfab b{background:#000;color:var(--gold)}
.cartdlg{max-width:760px}
.cartin{padding:22px}
.cartin h2{font-family:var(--f-display)}
body.xmas .cartin h2{font-family:var(--f-serif);font-weight:400}
body.black .cartin h2{font-family:var(--f-cond);font-weight:400;text-transform:uppercase}
.legal a{color:inherit}
@media (max-width:560px){.cartdlg .hidecell{display:none}.cartin{padding:18px 14px}.cartdlg .aptbl th:nth-child(3),.cartdlg .aptbl tbody td:nth-child(3){display:none}.cartdlg .aptbl tfoot td:first-child{white-space:normal}}

/* Freigabe */
.apbanner{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:color-mix(in srgb,var(--warn) 12%,var(--surface));border:1px solid color-mix(in srgb,var(--warn) 40%,var(--line));border-radius:10px;padding:8px 12px;font-weight:600;font-size:14px;margin:0 0 14px}
.apbanner.done{background:color-mix(in srgb,var(--ok) 12%,var(--surface));border-color:color-mix(in srgb,var(--ok) 45%,var(--line))}
.linkbtn{border:0;background:none;padding:0;color:var(--accent);font-weight:700;text-decoration:underline;cursor:pointer;font-size:14px}
.apb{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700;letter-spacing:.02em}
.apb.ok{background:var(--ok);color:#fff}.apb.rej{background:var(--accent);color:var(--accent-ink)}.apb.open{background:var(--surface-2);border:1px solid var(--line);color:var(--ink)}
.apb.stale{background:var(--warn);color:#fff}.apb.wait{background:transparent;border:1px dashed var(--line);color:var(--muted)}
.aph{margin:16px 0 8px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.prow{display:grid;grid-template-columns:150px minmax(0,1fr);gap:6px 12px;padding:10px;border-radius:10px;background:var(--surface-2);margin-bottom:6px}
.prow.inplan{box-shadow:inset 3px 0 0 var(--gold)}
.prow-l{font-weight:700;font-size:14px}
.prow-p{display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-width:0}
.prow-a{grid-column:2;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.prow-a input{max-width:200px}
.psug{flex-basis:100%;display:flex;flex-wrap:wrap;gap:6px}
.pchip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 4px 3px 10px;font-size:13px;font-weight:600;max-width:100%}
.pchip small{color:var(--muted);font-weight:500}
.pc-b{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:1px 8px;font-size:12px;font-weight:700;color:var(--ink);text-decoration:none}
.pc-x{border:0;background:transparent;font-size:16px;line-height:1;color:var(--muted);padding:0 6px}
.apsteps{list-style:none;display:flex;flex-wrap:wrap;gap:8px;padding:0;margin:4px 0 0}
.apsteps li{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;padding:5px 12px 5px 5px;font-weight:600;font-size:14px;background:var(--surface-2)}
.apsteps li span{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--line);font-weight:800;font-size:12px}
.apsteps li.ok span{background:var(--ok);color:#fff}.apsteps li.rej span{background:var(--accent);color:#fff}.apsteps li.cur{border-color:var(--gold);box-shadow:0 0 0 2px color-mix(in srgb,var(--gold) 35%,transparent)}.apsteps li.cur span{background:var(--gold);color:#000}
.aplist{display:flex;flex-direction:column;gap:6px}
.apitem{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 12px;border-radius:10px;background:var(--surface-2)}
.api-l{min-width:0;line-height:1.7}
.appanel{border:1px solid var(--gold);border-radius:12px;padding:14px;background:var(--surface)}
.tblwrap{overflow-x:auto;max-width:100%}
.aptbl{width:100%;border-collapse:collapse;font-size:13.5px}
.aptbl th{text-align:left;font-size:12px;color:var(--muted);font-weight:700;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.aptbl td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.aptbl td.num,.aptbl.deals th:nth-child(n+3){text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.aptbl tfoot td{font-weight:700;border-bottom:0}
@media (max-width:640px){.prow{grid-template-columns:1fr}.prow-a{grid-column:1}.prow-a input{max-width:none;flex:1 1 140px}}
</style>

const MONTHS = ['Jänner','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];

const S = {
  db:null, demo:false, canEdit:false, view:'kalender', sim:null,
  config:null, draft:null, dirty:false, loaded:false,
  f:{brand:'alle', cat:'alle', q:'', only:false}
};

/* ---------- Hilfsfunktionen ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const eur = n => (n == null || n === '' || isNaN(n)) ? '–' : '€ ' + Number(n).toLocaleString('de-AT',{minimumFractionDigits: Number(n)%1 ? 2 : 0, maximumFractionDigits:2}) + (Number(n)%1 ? '' : ',–');
const pad = n => String(n).padStart(2,'0');
const iso = (y,m,d) => y + '-' + pad(m) + '-' + pad(d);
const parseIso = s => { const [y,m,d] = s.split('-').map(Number); return {y,m,d}; };
const dowOf = s => { const {y,m,d} = parseIso(s); return new Date(Date.UTC(y,m-1,d)).getUTCDay(); };
const fmtShort = s => { const {m,d} = parseIso(s); return pad(d) + '.' + pad(m) + '.'; };
const fmtLong = s => { const {y,m,d} = parseIso(s); return WD[dowOf(s)] + ', ' + d + '. ' + MONTHS[m-1] + ' ' + y; };
const num = v => { if (v === '' || v == null) return null; const n = parseFloat(String(v).replace(',', '.')); return isNaN(n) ? null : n; };
const clone = o => JSON.parse(JSON.stringify(o));
const MEM = {};
const lsGet = k => { if (k in MEM) return MEM[k]; try { return localStorage.getItem(k); } catch(e) { return null; } };
const lsSet = (k,v) => { MEM[k] = v; try { localStorage.setItem(k,v); } catch(e) {} };

function viennaParts(){
  const p = {};
  new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/Vienna',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'})
    .formatToParts(new Date()).forEach(x => p[x.type] = x.value);
  return p;
}
function realToday(){ const p = viennaParts(); return p.year + '-' + p.month + '-' + p.day; }
function today(){ return S.sim || realToday(); }
function secondsLeft(){ const p = viennaParts(); return 86400 - (+p.hour*3600 + +p.minute*60 + +p.second); }
function fmtLeft(s){ const h = Math.floor(s/3600), m = Math.floor(s%3600/60), x = s%60; return pad(h) + ':' + pad(m) + ':' + pad(x); }

const MAXDAYS = 62;
const THEMES = { xmas:'Weihnachten', black:'Black Deals', classic:'Klassisch' };
const toUTC = s => { const x = parseIso(s); return Date.UTC(x.y, x.m-1, x.d); };
const fromUTC = t => { const d = new Date(t); return iso(d.getUTCFullYear(), d.getUTCMonth()+1, d.getUTCDate()); };
const addDays = (s, n) => fromUTC(toUTC(s) + n*864e5);
const diffDays = (a, b) => Math.round((toUTC(b) - toUTC(a)) / 864e5);
function blackFriday(y){ const nov1 = new Date(Date.UTC(y,10,1)).getUTCDay(); const thu = 1 + ((4 - nov1 + 7) % 7) + 21; return iso(y,11,thu+1); }
function presetYear(month){ const t = realToday(), y = +t.slice(0,4); return t > iso(y, month, 28) && month < 12 ? y + 1 : (t > iso(y,12,24) && month === 12 ? y + 1 : y); }
const PRESETS = {
  advent:  { label:'Advent (1.–24.12.)', make(){ const y = presetYear(12); return { start:iso(y,12,1), count:24, theme:'xmas', title:'Adventkalender' }; } },
  bf:      { label:'Black Friday', make(){ const y = presetYear(11); return { start:blackFriday(y), count:1, theme:'black', title:'Black Friday' }; } },
  bweek:   { label:'Black Week', make(){ const y = presetYear(11); const bf = blackFriday(y); return { start:addDays(bf,-4), count:8, theme:'black', title:'Black Week' }; } },
  bmonth:  { label:'Black Month (November)', make(){ const y = presetYear(11); return { start:iso(y,11,1), count:30, theme:'black', title:'Black Month' }; } },
  month:   { label:'Ganzer Monat', make(c){ const t = realToday(); const y = +t.slice(0,4), m = +t.slice(5,7); const n = new Date(Date.UTC(y,m,0)).getUTCDate(); return { start:iso(y,m,1), count:n, theme:'classic', title:'Aktionskalender ' + MONTHS[m-1] }; } }
};
const DEF_PHONE = '+43 1 615 39 00';
const DEF_IMPRESSUM = 'Beko Austria AG · Pfarrgasse 77, 1230 Wien · FN 36236 p';
function defaultConfig(){
  return Object.assign({ subtitle:'', pool:{}, days:{}, orderEmail:'order.austria@beko.com', orderPhone:DEF_PHONE, impressum:DEF_IMPRESSUM, shopUrl:'', example:false }, PRESETS.advent.make());
}
function normalize(c){
  if (!c.start){
    const y = +c.year || +realToday().slice(0,4);
    if (c.mode === 'month'){ const m = +c.month || 1; c.start = iso(y,m,1); c.count = new Date(Date.UTC(y,m,0)).getUTCDate(); c.theme = c.theme || 'classic'; }
    else { c.start = iso(y,12,1); c.count = 24; c.theme = c.theme || 'xmas'; }
  }
  c.count = Math.min(MAXDAYS, Math.max(1, parseInt(c.count,10) || 1));
  if (!THEMES[c.theme]) c.theme = 'classic';
  delete c.mode; delete c.year; delete c.month;
  c.pool = c.pool || {}; c.days = c.days || {};
  if (c.orderPhone == null) c.orderPhone = DEF_PHONE;
  if (c.impressum == null) c.impressum = DEF_IMPRESSUM;
  if (c.shopUrl == null) c.shopUrl = '';
  return c;
}
const telHref = t => 'tel:' + String(t || '').replace(/[^+\d]/g, '');
function legalLine(c){
  const mail = c.orderEmail || 'order.austria@beko.com';
  return 'Impressum: ' + esc(c.impressum || DEF_IMPRESSUM) + ' · Tel. <a href="' + telHref(c.orderPhone) + '">' + esc(c.orderPhone || DEF_PHONE) + '</a> · <a href="mailto:' + esc(mail) + '">' + esc(mail) + '</a>';
}
function periodDays(c){ const out = []; for (let i=0; i<c.count; i++) out.push(addDays(c.start, i)); return out; }
const isAdvent = c => c.theme === 'xmas' && c.count === 24 && c.start.slice(5) === '12-01';
const useWeekGrid = c => !isAdvent(c) && c.count >= 15;
const colsClass = c => useWeekGrid(c) ? '' : ' cols-' + (c.count <= 4 ? c.count : (c.count % 4 === 0 && c.count <= 16) ? 4 : (c.count === 5 ? 5 : 6));
function periodLabel(c){
  const d = periodDays(c), a = d[0], b = d[d.length-1];
  if (isAdvent(c)) return '1.–24. Dezember ' + a.slice(0,4);
  if (c.count === 1) return fmtLong(a);
  if (a.slice(8) === '01' && addDays(b,1).slice(8) === '01' && a.slice(0,7) === b.slice(0,7)) return MONTHS[+a.slice(5,7)-1] + ' ' + a.slice(0,4);
  return fmtShort(a) + ' – ' + fmtShort(b) + b.slice(0,4) + ' · ' + c.count + ' Tage';
}
function dealFor(c, day){
  const d = c.days[day]; if (!d || !d.k) return null;
  const p = BYK.get(d.k); if (!p) return null;
  const pool = c.pool[d.k] || {};
  return { day, p, hek: d.hek != null ? d.hek : (pool.hek ?? null), price: d.price ?? null, qty: d.qty ?? null, uvp: pool.uvp ?? p.u, note: d.note || '' };
}
function remainingFor(deal){ if (!deal || deal.qty == null) return null; return Math.max(0, deal.qty - ((S.sold && S.sold[deal.day]) || 0)); }
const status = day => day < today() ? 'past' : day === today() ? 'today' : 'future';
const imgTag = (p, cls) => p.i ? '<img src="' + p.i + '" alt="' + esc(p.b + ' ' + p.m) + '"' + (cls ? ' class="'+cls+'"' : '') + ' loading="lazy">' : '<div class="noimg"></div>';
function stockText(q){
  if (q == null) return '';
  if (q <= 0) return '<span class="stock out">Ausverkauft</span>';
  return '<span class="stock">' + (q === 1 ? 'Nur mehr 1 Stück verfügbar' : 'Nur mehr ' + q + ' Stück verfügbar') + '</span>';
}
function savePct(hek, price){ if (!hek || price == null || price >= hek) return ''; return '<span class="save">−' + Math.round((1 - price/hek)*100) + ' %</span>'; }
function toast(msg){ const t = $('toast-slot'); t.innerHTML = '<div class="toast" role="status">' + esc(msg) + '</div>'; clearTimeout(toast._t); toast._t = setTimeout(() => t.innerHTML = '', 2600); }

/* ---------- Beispielbelegung (nur Vorschau ohne Datenspeicher oder auf Knopfdruck) ---------- */
function exampleConfig(base){
  const c = clone(base || defaultConfig());
  const picks = [];
  const withImg = CAT.filter(p => p.i && p.u && p.u >= 300);
  BRANDS.forEach(b => withImg.filter(p => p.b === b).slice(0, b === 'Indesit' ? 4 : 10).forEach(p => picks.push(p)));
  picks.forEach(p => { c.pool[p.k] = { hek: Math.round(p.u * 0.62), uvp: p.u }; });
  const order = []; let i = 0; const byB = BRANDS.map(b => picks.filter(p => p.b === b));
  while (order.length < picks.length){ const arr = byB[i % byB.length]; const p = arr.shift(); if (p) order.push(p); i++; if (i > 500) break; }
  periodDays(c).forEach((day, n) => { const p = order[n % order.length]; const hek = c.pool[p.k].hek; c.days[day] = { k:p.k, hek, price: Math.round(hek * 0.85), qty: [3,5,8,4,10,6][n % 6] }; });
  c.example = true;
  return normalize(c);
}

/* ---------- Händleransicht ---------- */
function heroHTML(c, deal, opts){
  opts = opts || {};
  if (!deal){
    return '<section class="hero"><div class="info empty-hero"><div class="eyebrow">' + esc(opts.eyebrow || 'Heute') + '</div><h2>' + esc(opts.title || 'Heute keine Aktion') + '</h2><p class="small">' + esc(opts.text || '') + '</p>' + (opts.extra || '') + '</div></section>';
  }
  const p = deal.p, st = status(deal.day), expired = st === 'past';
  const subject = encodeURIComponent('Adventkalender-Bestellung ' + fmtShort(deal.day) + ' – ' + p.b + ' ' + p.m);
  const body = encodeURIComponent('Bestellung aus dem ' + (c.title || 'Adventkalender') + '\n\nAktionstag: ' + fmtLong(deal.day) + '\nGerät: ' + p.b + ' ' + p.m + ' (' + p.t + ')\nAktions-HEK: ' + eur(deal.price) + '\nMenge: \n\nHändler / Kundennummer: \n');
  const mail = c.orderEmail || 'order.austria@beko.com';
  let act = '';
  const rem = remainingFor(deal);
  if (st === 'today' && !(rem != null && rem <= 0) && deal.price != null){
    const inCart = (S.cart || []).find(x => x.day === deal.day && x.k === p.k);
    act = '<div class="orderbox"><label class="f qtyf">Menge<span class="stepper"><button type="button" data-qstep="-1" aria-label="Weniger">−</button><input type="number" id="ord-qty" min="1"' + (rem != null ? ' max="' + rem + '"' : '') + ' value="' + (inCart ? inCart.qty : 1) + '" inputmode="numeric"><button type="button" data-qstep="1" aria-label="Mehr">+</button></span></label>' +
      '<button type="button" class="btn primary" data-addcart="' + deal.day + '">' + (inCart ? 'Menge im Warenkorb ändern' : 'In den Warenkorb') + '</button></div>' +
      '<p class="small" style="margin:0">Oder bestellen per E-Mail <a href="mailto:' + esc(mail) + '?subject=' + subject + '&body=' + body + '">' + esc(mail) + '</a> bzw. Tel. <a href="' + telHref(c.orderPhone) + '">' + esc(c.orderPhone || DEF_PHONE) + '</a></p>';
  }
  return (expired ? '<div class="expired-banner">Aktion abgelaufen</div>' : '') +
    '<section class="hero"' + (expired ? ' style="filter:grayscale(.9)"' : '') + '><div class="pic">' + imgTag(p) + '</div><div class="info">' +
    '<div class="eyebrow">' + (st === 'today' ? 'Tagesaktion · ' : st === 'past' ? 'Abgelaufen · ' : '') + esc(fmtLong(deal.day)) + '</div>' +
    '<div class="badge-brand">' + esc(p.b) + ' · ' + esc(p.c) + '</div>' +
    '<h2>' + esc(p.m) + '</h2><p class="type">' + esc(p.t) + '</p>' +
    '<div class="prices"><div><span class="plabel">Aktions-HEK</span><span class="deal num">' + eur(deal.price) + '</span></div>' +
    (deal.hek ? '<div><span class="plabel">statt HEK</span><span class="was num">' + eur(deal.hek) + '</span></div>' : '') + savePct(deal.hek, deal.price) +
    (deal.uvp ? '<div><span class="plabel">UVP</span><span class="num">' + eur(deal.uvp) + '</span></div>' : '') + '</div>' +
    (deal.note ? '<p class="small" style="margin:0">' + esc(deal.note) + '</p>' : '') +
    (expired ? '<span class="stock out">Aktion abgelaufen</span>' : stockText(rem)) +
    (st === 'today' ? '<div class="clock">Bestellbar heute bis 23:59 Uhr · noch <b class="num" data-countdown>' + fmtLeft(secondsLeft()) + '</b></div>' : '') +
    act + '</div></section>';
}

function doorHTML(c, day, idx){
  const st = status(day), deal = dealFor(c, day);
  const d = useWeekGrid(c) ? parseIso(day).d : idx + 1;
  const opened = st === 'past' || (st === 'today' && lsGet('door-open-' + day) === '1');
  let inside;
  if (st === 'future') inside = '<div class="face inside"></div>';
  else if (!deal) inside = '<div class="face inside"><span class="dno">' + d + '</span>Keine Aktion</div>';
  else inside = '<div class="face inside"><span class="dno">' + d + '</span>' + imgTag(deal.p) +
    '<div class="m">' + esc(deal.p.m) + '</div><div class="p num">' + eur(deal.price) + '</div>' +
    (st === 'today' ? '<div class="q">' + (deal.qty != null ? (remainingFor(deal) <= 0 ? 'Ausverkauft' : 'Nur mehr ' + remainingFor(deal) + ' Stk.') : '') + '</div>' : '') +
    (st === 'past' ? '<div class="stamp">Aktion<br>abgelaufen</div>' : '') + '</div>';
  const cls = ['door', 'c' + ((d * 7 + 1) % 3), st, opened ? 'open' : '', (st !== 'future' && !deal) ? 'noact' : ''].join(' ');
  const label = 'Türchen ' + d + ', ' + fmtLong(day) + (st === 'future' ? ', noch geschlossen' : st === 'past' ? ', Aktion abgelaufen' : ', heute');
  return '<button type="button" class="' + cls + '" data-day="' + day + '" aria-label="' + esc(label) + '">' + inside +
    (st === 'today' && opened ? '<span class="ribbon">HEUTE</span>' : '') +
    '<div class="face flap"><span class="n">' + d + '</span><span class="d">' + WD[dowOf(day)] + ' ' + fmtShort(day) + '</span><span class="knob"></span></div></button>';
}

function doorNo(c, day){ return useWeekGrid(c) ? parseIso(day).d : diffDays(c.start, day) + 1; }
function renderDealer(){
  const c = S.config, days = periodDays(c), t = today();
  const first = days[0], last = days[days.length-1];
  let hero;
  if (t < first){
    const n = diffDays(t, first);
    hero = heroHTML(c, null, {eyebrow:'Demnächst', title:(c.count === 1 ? 'Die Aktion startet am ' : 'Das erste Türchen öffnet am ') + fmtLong(first), text: 'Noch ' + n + (n === 1 ? ' Tag' : ' Tage') + '. Ab dann gibt es jeden Tag von 0:00 bis 23:59 Uhr ein neues Aktionsgerät.'});
  } else if (t > last){
    hero = heroHTML(c, null, {eyebrow:'Beendet', title:'Der Aktionszeitraum ist vorbei', text:'Alle Türchen sind geöffnet. Die abgelaufenen Aktionen bleiben unten zur Übersicht sichtbar.'});
  } else {
    const deal = dealFor(c, t);
    hero = deal && lsGet('door-open-' + t) === '1' ? heroHTML(c, deal) :
      deal ? heroHTML(c, null, {eyebrow:'Tagesaktion · ' + fmtLong(t), title:'Das heutige Türchen wartet', text:'Öffne Türchen ' + doorNo(c,t) + ' und sieh dir die Tagesaktion an.', extra:'<div class="actions"><button type="button" class="btn primary" data-openday="' + t + '">Türchen ' + doorNo(c,t) + ' öffnen</button></div>'}) :
      heroHTML(c, null, {eyebrow:fmtLong(t), title:'Heute keine Aktion', text:'Morgen geht es weiter.'});
  }
  const isMonth = useWeekGrid(c);
  let grid = '';
  if (isMonth){
    grid += ['Mo','Di','Mi','Do','Fr','Sa','So'].map(w => '<div class="wd">' + w + '</div>').join('');
    const lead = (dowOf(first) + 6) % 7;
    for (let i=0; i<lead; i++) grid += '<div class="door blank" aria-hidden="true"></div>';
  }
  grid += days.map((day, i) => doorHTML(c, day, i)).join('');
  const periodName = periodLabel(c);
  $('app').innerHTML = hero +
    '<div class="cal-head"><h3>' + esc(periodName) + '</h3><div class="legend"><span><i class="l-closed" style="background:var(--door)"></i>noch geschlossen</span><span><i style="background:var(--accent)"></i>heute</span><span><i style="background:var(--past)"></i>Aktion abgelaufen</span></div></div>' +
    '<div class="grid' + (isMonth ? ' month' : colsClass(c)) + '" id="doors">' + grid + '</div>' +
    '<p class="small" style="margin-top:18px">Alle Preise als Händlereinkaufspreise (HEK) exkl. MwSt., solange der Vorrat reicht. Jede Aktion gilt ausschließlich am angegebenen Tag von 0:00 bis 23:59 Uhr (MEZ) bestellbar. Druck- und Satzfehler vorbehalten.</p>' +
    '<p class="small legal">' + legalLine(c) + '</p>' +
    (c.theme !== 'xmas' ? '' : '<p class="xmas-foot">Frohe Weihnachten und gute Geschäfte<small>Ihr Beko Austria Team · elektrabregenz · Beko · Indesit</small></p>');
}

function openDoor(day, btn){
  const st = status(day);
  if (st === 'future'){ btn && (btn.classList.remove('shake'), void btn.offsetWidth, btn.classList.add('shake')); toast('Dieses Türchen öffnet am ' + fmtLong(day)); return; }
  if (st === 'today' && lsGet('door-open-' + day) !== '1'){
    lsSet('door-open-' + day, '1');
    if (btn){ btn.classList.add('open'); setTimeout(render, 950); } else render();
    return;
  }
  const deal = dealFor(S.config, day);
  if (!deal){ toast('Am ' + fmtShort(day) + ' gab es keine Aktion'); return; }
  $('overlay-slot').innerHTML = '<div class="overlay" id="ov"><div class="dialog" role="dialog" aria-modal="true" aria-label="Aktion ' + esc(fmtShort(day)) + '"><button type="button" class="x" id="ov-x" aria-label="Schließen">×</button>' + heroHTML(S.config, deal) + '</div></div>';
  $('ov-x').focus();
}

/* ---------- Verwaltung ---------- */
function markDirty(){ S.dirty = true; renderSavebar(); }
function renderSavebar(){
  const slot = $('savebar-slot');
  if (S.view !== 'admin'){ slot.innerHTML = ''; return; }
  const pc = Object.keys(S.draft.pool).length, dc = periodDays(S.draft).filter(d => S.draft.days[d] && S.draft.days[d].k).length;
  slot.innerHTML = '<div class="savebar"><div class="wrap"><span class="small"><b>' + pc + '</b> Geräte im Aktionssortiment · <b>' + dc + '</b> von ' + periodDays(S.draft).length + ' Tagen belegt' +
    (S.dirty ? ' · <span class="dirty">Nicht gespeicherte Änderungen</span>' : '') + '</span>' +
    '<span style="display:flex;gap:8px;flex-wrap:wrap">' + (S.api ? '<button type="button" class="btn" id="btn-logout">Abmelden</button>' : '') + '<button type="button" class="btn" id="btn-discard"' + (S.dirty ? '' : ' disabled') + '>Verwerfen</button><button type="button" class="btn primary" id="btn-save"' + (S.dirty ? '' : ' disabled') + '>Speichern &amp; veröffentlichen</button></span></div></div>';
}

function poolCard(p){
  const on = !!S.draft.pool[p.k], e = S.draft.pool[p.k] || {};
  return '<div class="pcard' + (on ? ' on' : '') + '" data-k="' + esc(p.k) + '">' + imgTag(p) +
    '<div class="meta"><div class="badge-brand">' + esc(p.b) + ' · ' + esc(p.c) + '</div><div class="m">' + esc(p.m) + '</div><div class="t">' + esc(p.t) + '</div></div>' +
    '<div class="row"><label class="f">HEK €<input type="number" step="0.01" min="0" inputmode="decimal" id="hek-' + esc(p.k) + '" data-f="hek" value="' + (e.hek ?? '') + '"' + (on ? '' : ' disabled') + ' placeholder="HEK"></label>' +
    '<label class="f">UVP €<input type="number" step="0.01" min="0" inputmode="decimal" id="uvp-' + esc(p.k) + '" data-f="uvp" value="' + (e.uvp ?? p.u ?? '') + '"' + (on ? '' : ' disabled') + '></label>' +
    '<button type="button" class="toggle" data-toggle>' + (on ? '✓ Im Sortiment' : '+ Aufnehmen') + '</button></div>' + (on ? assignHTML(p) : '') + '</div>';
}
function assignHTML(p){
  const days = periodDays(S.draft), mine = days.filter(d => S.draft.days[d] && S.draft.days[d].k === p.k);
  const opts = days.filter(d => !mine.includes(d)).map(d => { const o = S.draft.days[d] && BYK.get(S.draft.days[d].k);
    return '<option value="' + d + '">' + WD[dowOf(d)] + ' ' + fmtShort(d) + (o ? ' – ersetzt ' + esc(o.m) : ' – frei') + (status(d) === 'past' ? ' (vorbei)' : '') + '</option>'; }).join('');
  return '<div class="assign"><span class="assign-l">Aktionstag' + (mine.length > 1 ? 'e' : '') + ' · bestellbar 0:00–23:59 Uhr</span>' +
    '<div class="assign-chips">' + (mine.length ? mine.map(d => '<button type="button" class="dchip" data-unassign="' + d + '" aria-label="Aktionstag ' + fmtShort(d) + ' entfernen">' + WD[dowOf(d)] + ' ' + fmtShort(d) + ' <b>×</b></button>').join('') : '<span class="small">noch keinem Tag zugeordnet</span>') + '</div>' +
    '<select data-assign aria-label="Aktionstag für ' + esc(p.m) + ' wählen"><option value="">+ Datum zuordnen …</option>' + opts + '</select></div>';
}
function refreshCard(k){ const el = document.querySelector('.pcard[data-k="' + CSS.escape(k) + '"]'); if (el) el.outerHTML = poolCard(BYK.get(k)); }
function assignDay(day, k){
  const prev = S.draft.days[day] || {}, hek = S.draft.pool[k] ? S.draft.pool[k].hek : null, oldK = prev.k;
  S.draft.days[day] = prev.k === k ? prev : { k, hek:null, price: hek != null ? Math.round(hek * 0.9) : null, qty: prev.qty ?? 5 };
  markDirty(); refreshCard(k); if (oldK && oldK !== k) refreshCard(oldK); renderDays();
}
function filteredCat(){
  const f = S.f, q = f.q.trim().toLowerCase();
  return CAT.filter(p => (f.brand === 'alle' || p.b === f.brand) && (f.cat === 'alle' || p.c === f.cat) &&

function autoFill(){
  const keys = []; const byB = BRANDS.map(b => CAT.filter(p => p.b === b && S.draft.pool[p.k]).map(p => p.k));
  const total = byB.reduce((a,b) => a + b.length, 0);
  if (!total){ toast('Zuerst Geräte ins Aktionssortiment aufnehmen'); return; }
  let i = 0; while (keys.length < total){ const a = byB[i % 3]; if (a.length) keys.push(a.shift()); i++; }
  const used = new Set(Object.values(S.draft.days).map(d => d && d.k).filter(Boolean));
  const fresh = keys.filter(k => !used.has(k)), seq = fresh.length ? fresh.concat(keys) : keys;
  let n = 0, filled = 0;
  periodDays(S.draft).forEach(day => {
    const d = S.draft.days[day];
    if (d && d.k) return;
    const k = seq[n++ % seq.length], hek = S.draft.pool[k].hek;
    S.draft.days[day] = { k, hek: null, price: hek != null ? Math.round(hek * 0.9) : null, qty: 5 }; filled++;
  });
  markDirty(); renderDays(); renderSavebar(); toast(filled + ' Tage gefüllt');
}

async function save(){
  const data = clone(S.draft); data.example = false; data.updatedAt = new Date().toISOString();
  normalize(data);
  if (S.api){
    const btn = $('btn-save'); if (btn){ btn.disabled = true; btn.textContent = 'Speichert …'; }
    try {
      const r = await fetch('/api/config', { method:'PUT', headers:{ 'content-type':'application/json', 'authorization':'Bearer ' + S.pw }, body: JSON.stringify(data) });
      if (r.status === 401){ ssSet('kal-admin', null); S.canEdit = false; S.view = 'kalender'; renderSavebar(); render(); toast('Anmeldung abgelaufen – bitte unter /admin neu anmelden. Deine Änderungen wurden nicht gespeichert.'); return; }
      if (!r.ok) throw new Error('http ' + r.status);
      const j = await r.json(); data.updatedAt = j.updatedAt || data.updatedAt;
      S.config = data; S.draft = clone(data); S.dirty = false; renderSavebar(); renderAdmin(); toast('Gespeichert – Händler sehen jetzt den neuen Stand');
    } catch(e){ renderSavebar(); toast('Speichern nicht möglich – bitte Internetverbindung prüfen und erneut speichern'); }
    return;
  }
  if (S.demo || !S.db){ S.config = data; S.draft = clone(data); S.dirty = false; renderSavebar(); toast('Vorschau: übernommen, aber nicht dauerhaft gespeichert'); return; }
  const btn = $('btn-save'); if (btn){ btn.disabled = true; btn.textContent = 'Speichert …'; }
  try {
    await S.db.doc('calendar/config').set(data);
    S.config = data; S.draft = clone(data); S.dirty = false; renderSavebar(); renderAdmin(); toast('Gespeichert – Händler sehen jetzt den neuen Stand');
  } catch(e){
    renderSavebar(); toast('Speichern nicht möglich: ' + (e && e.code === 'not_granted' ? 'keine Berechtigung' : 'bitte erneut versuchen'));
  }
}

function flyerDoc(c, opt){

  const orderBar = '<footer class="obar"><div><b>So bestellen Sie</b>' + (web ? 'Online: ' + webA + '<br>' : '') + 'E-Mail: ' + mailA + '<br>Telefon: ' + telA + '<br>Am Aktionstag Modell und Stückzahl angeben – Zuteilung nach Eingang, solange der Vorrat reicht.</div><div class="fine">' + fine + '<br><br>' + imp + '</div></footer>';
  const unit = '<span>' + esc(title.toUpperCase()) + '</span><b>✦</b><span>' + (c.count === 1 ? 'Nur 1 Tag' : deals.length + ' Tage · ' + deals.length + ' Deals') + '</span><b>✦</b><span>Nur 0:00–23:59 Uhr</span><b>✦</b>';

  const smallHead = '<header class="band sm"><div class="logos">' + logos + '</div><h2>' + esc(title) + ' · Fortsetzung</h2></header>';
  /* Zeilen bilden: 4 Kacheln pro Zeile, Black-Friday-Deal (Design Black, max. 11 Deals) als eigene Zeile */
  const pages = [];
  if (!deals.length){
    pages.push(bigHead + '<div class="grid" style="grid-template-rows:1fr"><div class="t" style="grid-column:1/-1;justify-content:center;align-items:center;text-align:center"><div class="m">Noch keine Aktionen geplant</div><div class="ty" style="height:auto">In der Verwaltung Geräte den Aktionstagen zuordnen.</div></div></div>' + orderBar);

async function flyDownload(){
  const c = S.config, html = flyerDoc(c), name = flyFileName(c);
  let dl = null; try { dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null; } catch(e) {}
  if (dl){
    try { await dl.save({ filename: name, data: html }); toast('Flyer gespeichert – im Browser öffnen und als PDF drucken'); }
    catch(err){ if (err && err.code === 'declined') return; if (err && err.code === 'rate_limited'){ toast('Bitte kurz warten und erneut versuchen'); return; } toast('Download hier nicht verfügbar'); }
    return;
  }
  try { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([html], {type:'text/html'})); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000); }
  catch(e){ toast('Download hier nicht verfügbar'); }
}
function loadLib(src, globalName){

}

/* ---------- Freigabeprozess (Produktmanagement je Kategorie → Finance → Marketing → Sales Director) ---------- */
const STAGES = [ {id:'pm', label:'Produktmanagement'}, {id:'finance', label:'Finance'}, {id:'marketing', label:'Marketing'}, {id:'sd', label:'Sales Director'} ];
const CAT_NORM = { 'Gefrierschränke':'Gefrieren', 'Mikrowellengeräte':'Mikrowellen' };
const catOf = p => CAT_NORM[p.c] || p.c || 'Sonstige';
const PM_ORDER = ['Backöfen','Koch/Back Sets','Kochfelder','Dunstabzug','Mikrowellen','Kühlen','Gefrieren','Waschen','Trocknen','Spülen'];
const PM_CATS = [...new Set(CAT.map(catOf))].sort((a,b) => (PM_ORDER.indexOf(a)+1 || 99) - (PM_ORDER.indexOf(b)+1 || 99) || a.localeCompare(b));
S.ap = { docs:{}, uid:null, pid:null, token:null, loaded:false, sel:null, busy:false, userApi:null };
const keyLabel = k => k.startsWith('pm:') ? 'Produktmanagement · ' + k.slice(3) : (STAGES.find(s => s.id === k) || {}).label || k;
function apPeople(c, key){
  const a = (c.approval && c.approval.people) || {};
  if (key.startsWith('pm:')) return ((a.pm || {})[key.slice(3)] || []);
  return a[key] || [];
}
function ensureApproval(c){
  c.approval = c.approval || {}; const p = c.approval.people = c.approval.people || {};
  p.pm = p.pm || {}; ['finance','marketing','sd'].forEach(k => p[k] = p[k] || []);

}
function fnv(str){ let h = 0x811c9dc5; for (let i = 0; i < str.length; i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; } return h.toString(36); }
function planDeals(c){ return periodDays(c).map(d => dealFor(c, d)).filter(Boolean); }
function dealsForKey(c, key){ const all = planDeals(c); return key.startsWith('pm:') ? all.filter(d => catOf(d.p) === key.slice(3)) : all; }
function keyHash(c, key){
  return fnv(JSON.stringify([c.start, c.count, dealsForKey(c, key).map(d => [d.day, d.p.k, d.hek, d.price, d.qty, d.uvp])]));
}
const identOf = p => S.api ? p.pid : p.uid;
function evalKey(c, key){
  const ppl = apPeople(c, key), h = keyHash(c, key);
  const recs = ppl.map(p => { const doc = S.ap.docs[identOf(p)]; const r = doc && doc.entries && doc.entries[key]; return r ? Object.assign({ who: p.name || r.name }, r) : null; }).filter(Boolean);
  const valid = recs.filter(r => r.hash === h).sort((a,b) => String(b.at).localeCompare(String(a.at)));
  if (!ppl.length) return { state:'nobody', people:ppl };
  if (valid.length) return { state: valid[0].status === 'ok' ? 'ok' : 'rejected', rec: valid[0], people:ppl };
  return { state: recs.length ? 'stale' : 'open', people:ppl };
}
function apStatus(c){
  const deals = planDeals(c);
  const cats = [...new Set(deals.map(d => catOf(d.p)))].sort((a,b) => PM_CATS.indexOf(a) - PM_CATS.indexOf(b));
  const pm = cats.map(cat => Object.assign({ key:'pm:' + cat, cat, n: deals.filter(d => catOf(d.p) === cat).length }, evalKey(c, 'pm:' + cat)));
  const st = { deals, cats, pm, stages:{} };
  st.stages.pm = { ok: cats.length > 0 && pm.every(x => x.state === 'ok'), rejected: pm.some(x => x.state === 'rejected') };
  let prevOk = st.stages.pm.ok;
  ['finance','marketing','sd'].forEach(k => { const e = evalKey(c, k); st.stages[k] = Object.assign(e, { reached: prevOk, ok: prevOk && e.state === 'ok', rejected: prevOk && e.state === 'rejected' }); prevOk = st.stages[k].ok; });
  st.stages.pm.reached = true;
  st.done = st.stages.sd.ok;
  st.current = st.done ? null : STAGES.find(s => !st.stages[s.id].ok).id;
  st.okCount = STAGES.filter(s => st.stages[s.id].ok).length;
  return st;
}
function myPersons(c){

  Object.entries(a.pm || {}).forEach(([cat, arr]) => (arr || []).forEach(p => { if (mine(p)) out.push({ key:'pm:' + cat, p }); }));
  ['finance','marketing','sd'].forEach(k => (a[k] || []).forEach(p => { if (mine(p)) out.push({ key:k, p }); }));

}

  const head = ['Bestellnummer','Eingang','Aktionstag','Marke','Modell','Menge','Aktions-HEK','Summe','Firma','Kundennummer','Ansprechpartner','E-Mail','Telefon','Lieferadresse','Bemerkung','Mail'];
  const lines = [head.map(q).join(';')];
  (S.orders || []).forEach(o => o.items.forEach(x => lines.push([o.no, fmtAt(o.at), fmtShort(x.day), x.brand, x.model, x.qty, String(x.price).replace('.',','), String(x.line).replace('.',','), o.customer.firma, o.customer.kdnr, o.customer.name, o.customer.email, o.customer.tel, o.customer.adresse, o.customer.notiz, o.mail || ''].map(q).join(';'))));
  const r = await saveFile('Bestellungen_' + (S.config.title || 'Aktionskalender').replace(/[^\wäöüÄÖÜß-]+/g,'_') + '_' + today() + '.csv', new Blob(['﻿' + lines.join('\r\n')], { type:'text/csv' }));
  if (r === 'saved') toast('CSV gespeichert');
}
document.addEventListener('click', e => {
  const t = e.target;
  if (t.closest('#cart-fab')){ cartDialog(); return; }
  if (t.id === 'ov-x2'){ $('overlay-slot').innerHTML = ''; return; }
  const ac = t.closest('[data-addcart]'); if (ac){ addToCart(ac.dataset.addcart); return; }
  const qs = t.closest('[data-qstep]'); if (qs){ const inp = $('ord-qty'); if (inp){ const mx = inp.max ? +inp.max : 999; inp.value = Math.min(mx, Math.max(1, (+inp.value || 1) + (+qs.dataset.qstep))); } return; }
  const cq = t.closest('[data-cq]'); if (cq){ const [day, k] = cq.dataset.ci.split(/\|(.*)/s); const it = S.cart.find(x => x.day === day && x.k === k); if (it){ const rem = remainingFor(dealFor(S.config, day)); it.qty = Math.max(1, it.qty + (+cq.dataset.cq)); if (rem != null) it.qty = Math.min(it.qty, rem); cartSave(); const keep = {}; CUST_FIELDS.forEach(([f]) => { const el = $('cu-' + f); if (el) keep[f] = el.value; }); custSave(Object.assign(custLoad(), keep)); cartDialog(); renderCartFab(); } return; }
  const cd = t.closest('[data-cdel]'); if (cd){ const [day, k] = cd.dataset.cdel.split(/\|(.*)/s); S.cart = S.cart.filter(x => !(x.day === day && x.k === k)); cartSave(); renderCartFab(); cartDialog(); return; }
  if (t.id === 'ord-reload'){ S.orders = null; renderOrders(); return; }
  if (t.id === 'ord-csv'){ ordersCsv(); return; }
});
document.addEventListener('submit', e => { if (e.target.id === 'orderform'){ e.preventDefault(); submitOrder(); } });

/* ---------- Gesamtdarstellung ---------- */
function renderHeader(){
  const c = S.view === 'admin' ? S.draft : S.config;
  document.body.classList.toggle('xmas', c.theme === 'xmas');
  document.body.classList.toggle('black', c.theme === 'black');
  $('h-title').textContent = c.title || 'Aktionskalender';
  const last = periodDays(c)[c.count-1];
  $('h-sub').textContent = c.count === 1
    ? 'Am ' + fmtLong(c.start) + ' ein Top-Gerät zum Sonder-HEK für den Fachhandel – nur von 0:00 bis 23:59 Uhr bestellbar.'
    : 'Vom ' + fmtShort(c.start) + ' bis ' + fmtShort(last) + last.slice(0,4) + ' jeden Tag ein neues Aktionsgerät zum Sonder-HEK für den Fachhandel. Jede Aktion gilt nur am jeweiligen Tag von 0:00 bis 23:59 Uhr.';
  const mq = $('marquee'); if (mq){ const unit = '<span>' + esc((c.title || 'Black Deals').toUpperCase()) + '</span><b>✦</b><span>' + (c.count === 1 ? 'Nur 1 Tag' : 'Täglich neuer Deal') + '</span><b>✦</b><span>Nur 0:00–23:59 Uhr</span><b>✦</b><span>Solange der Vorrat reicht</span><b>✦</b>'; mq.innerHTML = '<div class="mq-track">' + unit.repeat(6) + '</div>'; }
  const notes = [];
  if (S.sim) notes.push('Testansicht für den ' + fmtLong(S.sim));
  if (S.config.example && S.view !== 'admin') notes.push('Beispieldaten – Preise noch nicht freigegeben');
  if (S.demo && S.view !== 'admin') notes.push('Vorschau mit Beispieldaten');
  $('h-notice').innerHTML = notes.map(n => '<span class="notice">' + esc(n) + '</span> ').join('');
  const apv = isApprover() || (S.api && !!S.ap.token);
  $('tabs').hidden = !(S.canEdit || apv); $('tab-adm').hidden = !S.canEdit; $('tab-fly').hidden = !S.canEdit; $('tab-ord').hidden = !S.canEdit;
  $('tab-ord').setAttribute('aria-pressed', S.view === 'orders');
  $('tab-apv').setAttribute('aria-pressed', S.view === 'approval');
  $('tab-kal').setAttribute('aria-pressed', S.view === 'kalender'); $('tab-adm').setAttribute('aria-pressed', S.view === 'admin'); $('tab-fly').setAttribute('aria-pressed', S.view === 'flyer');
}
function render(){
  if (!S.loaded) return;
  if (S.api && !S.canEdit && wantsAdmin()){ renderHeader(); renderLogin(); renderSavebar(); return; }
  renderHeader();
  if (S.view === 'admin') renderAdmin(); else if (S.view === 'orders' && S.canEdit) renderOrders(); else if (S.view === 'flyer' && S.canEdit) renderFlyer(); else if (S.view === 'approval' && (S.canEdit || isApprover() || (S.api && S.ap.token))) renderApproval(); else { if (S.view !== 'kalender') S.view = 'kalender'; renderHeader(); renderDealer(); renderSavebar(); }
  renderCartFab();
}


/* ---------- Schnee & Lichterkette ---------- */
(function decor(){
  const lights = $('lights'), cols = ['#E8433F','#F2C14E','#5FBF77','#F6F1E1','#4F8FE8'];
  function buildLights(){ const n = Math.ceil((lights.offsetWidth || window.innerWidth) / 60) + 1; let h = '';
    for (let i=0; i<n; i++) h += '<span style="--b:' + cols[i % cols.length] + ';--dl:' + ((i * 0.37) % 2.4).toFixed(2) + 's"></span>'; lights.innerHTML = h; }
  buildLights(); window.addEventListener('resize', buildLights);
  const cv = $('snow'), ctx = cv.getContext('2d'); let flakes = [], W = 0, H = 0;
  const still = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function size(){ const r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1; W = r.width; H = r.height; cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
    const n = Math.round(W * H / 4500); flakes = Array.from({length:n}, () => ({x:Math.random()*W, y:Math.random()*H, r:Math.random()*1.8+.6, s:Math.random()*.5+.25, w:Math.random()*Math.PI*2})); }
  function draw(){ ctx.clearRect(0,0,W,H); ctx.fillStyle = 'rgba(255,255,255,.85)';
    flakes.forEach(f => { ctx.globalAlpha = .35 + f.r/4; ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, Math.PI*2); ctx.fill(); }); ctx.globalAlpha = 1; }
  function tick(){ if (document.body.classList.contains('xmas') && !document.hidden){ flakes.forEach(f => { f.y += f.s; f.w += .01; f.x += Math.sin(f.w) * .3; if (f.y > H + 3){ f.y = -3; f.x = Math.random()*W; } }); draw(); } requestAnimationFrame(tick); }
  size(); draw(); window.addEventListener('resize', () => { size(); draw(); });
  if (!still) requestAnimationFrame(tick);
})();

let lastDay = realToday();
setInterval(() => {
  const el = document.querySelector('[data-countdown]'); if (el) el.textContent = fmtLeft(secondsLeft());
  const d = realToday(); if (d !== lastDay){ lastDay = d; if (S.view === 'kalender') render(); }
}, 1000);

/* ---------- Start ---------- */
(async function start(){
  let db = null, user = null;
  try { if (window.claude && window.claude.use){ [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]); } } catch(e) {}
  if (!db){
    const raw = await apiLoad();
    if (raw !== undefined){
      S.api = true; S.config = cfgFrom(raw); S.draft = clone(S.config); S.loaded = true; cartLoad();
      const pw = ssGet('kal-admin'); if (pw && await apiAuth(pw)){ S.pw = pw; S.canEdit = true; if (wantsAdmin()) S.view = 'admin'; const full = await apiLoad(); if (full !== undefined){ S.config = cfgFrom(full); S.draft = clone(S.config); } }
      await Promise.all([apWhoami(), apLoadApprovals()]);
      if (S.ap.token && !wantsAdmin()) S.view = 'approval';
      render();
      setInterval(poll, 60000); document.addEventListener('visibilitychange', () => { if (!document.hidden) poll(); });
      return;
    }
    S.demo = true; S.canEdit = true; S.config = exampleConfig(defaultConfig()); S.config.example = false; S.draft = clone(S.config); S.loaded = true; cartLoad(); render(); return;
  }
  S.db = db;
  try { S.canEdit = user ? !!(await user.canEdit()) : false; } catch(e) { S.canEdit = false; }
  S.ap.userApi = user; try { S.ap.uid = user ? await user.id() : null; } catch(e) { S.ap.uid = null; }
  db.collection('stock').onSnapshot(snap => { const m = {}; snap.docs.forEach(d => { if (d.exists) m[d.id] = (d.data() || {}).n || 0; }); S.sold = m; if (S.loaded && S.view === 'kalender' && !$('ov')) renderDealer(); }, () => {});
  db.collection('approvals').onSnapshot(snap => {
    const docs = {}; snap.docs.forEach(d => { if (d.exists) docs[d.id] = d.data(); }); S.ap.docs = docs; S.ap.loaded = true;
    if (!S.loaded) return;
    if (S.view === 'approval' && !S.ap.sel) render(); else if (S.view !== 'admin' || !S.dirty) renderHeader();
  }, () => {});
  db.doc('calendar/config').onSnapshot(snap => {
    const data = snap.exists ? snap.data() : null;
    S.config = data ? normalize(Object.assign({ orderEmail:'order.austria@beko.com', title:'' }, data)) : defaultConfig();
    if (!S.dirty) S.draft = clone(S.config);
    const first = !S.loaded; S.loaded = true; if (first) cartLoad();
    if (first || S.view === 'kalender') render();
    else if (!S.dirty) render();
  }, () => { S.config = S.config || defaultConfig(); S.draft = S.draft || clone(S.config); S.loaded = true; render(); });
})();
})();
</script>
